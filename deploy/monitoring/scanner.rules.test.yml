      - series: tokenworks_mobile_control_last_success_timestamp_seconds{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a",worker="outbox"}
        values: 0+15x40
      - series: tokenworks_mobile_control_available{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a",worker="leases"}
        values: 1+0x40
      - series: tokenworks_mobile_control_last_success_timestamp_seconds{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a",worker="leases"}
        values: 0+15x40
      - series: tokenworks_mobile_control_available{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a",worker="consumer"}
        values: 1+0x40
      - series: tokenworks_mobile_control_last_success_timestamp_seconds{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a",worker="consumer"}
        values: 0+15x40
      - series: tokenworks_mobile_control_available{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a",worker="consumer_cleanup"}
        values: 1+0x40
      - series: tokenworks_mobile_control_last_success_timestamp_seconds{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a",worker="consumer_cleanup"}
        values: 0+15x40
      - series: tokenworks_mobile_control_available{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a",worker="approval_expiry"}
        values: 1+0x40
      - series: tokenworks_mobile_control_last_success_timestamp_seconds{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a",worker="approval_expiry"}
        values: 0+15x40
      - series: tokenworks_mobile_file_scanner_enabled{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a"}
        values: 1+0x40
      - series: tokenworks_mobile_file_scanner_ready{job="tokenworks-mobile",cluster="fixture",database_scope="db-a",instance="node-a"}
        values: 0+0x2 1+0x38
    alert_rule_test:
      - eval_time: 3m
        alertname: DshRemoteScannerUnready
        exp_alerts: []
